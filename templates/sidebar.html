<div class="sidebar">
    <h1>FastAPI HTMX</h1>
    
    <div class="sidebar-section">
        <h3>Navigation</h3>
        <ul class="sidebar-menu">
            <li><a href="/dashboard" {% if page == 'dashboard' %}class="active"{% endif %}>Dashboard</a></li>
            <li><a href="/help" {% if page == 'help' %}class="active"{% endif %}>Help</a></li>
        </ul>
    </div>
    
    <div class="sidebar-section">
        <h3>Edit Tables</h3>
        <div style="display: flex; gap: 8px; flex-direction: column;">
            <select id="table-select" style="padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-content); color: var(--text-primary); font-size: 14px; transition: background 0.3s, color 0.3s;">
                <option value="">Loading tables...</option>
            </select>
            <button onclick="openTable()" class="btn btn-primary" style="font-size: 14px; padding: 8px 12px;">Open Table</button>
        </div>
    </div>
    
    <div class="sidebar-section">
        <h3>Run Scripts</h3>
        <div style="display: flex; gap: 8px; flex-direction: column;">
            <select id="script-select" style="padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-content); color: var(--text-primary); font-size: 14px; transition: background 0.3s, color 0.3s;">
                <option value="">Loading scripts...</option>
            </select>
            <button onclick="executeScript()" class="btn btn-primary" style="font-size: 14px; padding: 8px 12px;">Execute Script</button>
            <a href="/logs" {% if page == 'logs' %}class="active"{% endif %} style="display: block; padding: 8px 12px; text-align: center; background: var(--bg-button-secondary); color: var(--text-primary); border-radius: 4px; text-decoration: none; font-size: 14px; transition: background 0.3s;">📋 View Logs</a>
            <div id="script-status-indicator" style="padding: 8px; text-align: center; display: none; background: #e3f2fd; border-radius: 4px; color: #1976d2; font-size: 12px; cursor: pointer; transition: background 0.3s;" onclick="window.location.href='/background-scripts'" title="Click to view background scripts">
                🔄 Running: <span id="active-script-count">0</span>
            </div>
            {% if can_run_scripts %}
            <a href="/background-scripts" {% if page == 'background-scripts' %}class="active"{% endif %} style="display: block; padding: 8px 12px; text-align: center; background: var(--bg-button-secondary); color: var(--text-primary); border-radius: 4px; text-decoration: none; font-size: 14px; transition: background 0.3s;">Background Scripts</a>
            {% endif %}
        </div>
    </div>
    
    {% if is_admin %}
    <div class="sidebar-section">
        <h3>Admin</h3>
        <ul class="sidebar-menu">
            <li><a href="/admin" {% if page == 'admin' %}class="active"{% endif %}>Admin Panel</a></li>
        </ul>
    </div>
    {% endif %}
    
    <div class="sidebar-section" style="margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <h3>Appearance</h3>
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="btn" style="width: 100%; background: var(--bg-button-primary); color: white; padding: 8px 12px; margin: 0; font-size: 14px;">🌙 Dark Mode</button>
    </div>
    
    <div class="sidebar-section" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <h3>Account</h3>
        <ul class="sidebar-menu">
            <li><a href="/logout" class="btn btn-danger" style="padding: 8px 12px; margin: 0;">Logout</a></li>
        </ul>
    </div>
</div>

<script>
// Load available tables on page load
document.addEventListener('DOMContentLoaded', function() {
    // Clear any pending script execution timeout
    if (window.scriptExecutionTimeout) {
        clearTimeout(window.scriptExecutionTimeout);
        window.scriptExecutionTimeout = null;
    }
    
    fetch('/api/tables')
        .then(response => response.json())
        .then(data => {
            const tableSelect = document.getElementById('table-select');
            tableSelect.innerHTML = '<option value="">-- Select Table --</option>';
            data.tables.forEach(table => {
                const option = document.createElement('option');
                // Handle both old format (string) and new format (object with display_name)
                const tableName = typeof table === 'string' ? table : table.table_name;
                const displayName = typeof table === 'string' ? table : (table.display_name || table.table_name);
                option.value = tableName;
                option.textContent = displayName;
                // Select the first table by default
                if (data.tables.length > 0 && tableName === (typeof data.tables[0] === 'string' ? data.tables[0] : data.tables[0].table_name)) {
                    option.selected = true;
                }
                tableSelect.appendChild(option);
            });
        })
        .catch(err => {
            console.error('Failed to load tables:', err);
            document.getElementById('table-select').innerHTML = '<option value="">Error loading tables</option>';
        });
    
    // Load available scripts
    fetch('/api/scripts')
        .then(response => response.json())
        .then(data => {
            const scriptSelect = document.getElementById('script-select');
            scriptSelect.innerHTML = '<option value="">-- Select Script --</option>';
            if (data.scripts && data.scripts.length > 0) {
                data.scripts.forEach(script => {
                    const option = document.createElement('option');
                    option.value = script.name;
                    option.textContent = script.name;
                    scriptSelect.appendChild(option);
                });
            } else {
                scriptSelect.innerHTML = '<option value="">No scripts available</option>';
            }
        })
        .catch(err => {
            console.error('Failed to load scripts:', err);
            document.getElementById('script-select').innerHTML = '<option value="">Error loading scripts</option>';
        });
});

function openTable() {
    const tableSelect = document.getElementById('table-select');
    const tableName = tableSelect.value;
    if (tableName) {
        // Full page navigation instead of partial fetch
        window.location.href = `/table/${tableName}`;
    }
}

function executeScript() {
    const scriptSelect = document.getElementById('script-select');
    const scriptName = scriptSelect.value;
    
    if (!scriptName) {
        alert('Please select a script to execute');
        return;
    }
    
    // Disable all navigation elements
    const tableSelect = document.getElementById('table-select');
    const openTableBtn = document.querySelector('button.btn-primary');
    const navLinks = document.querySelectorAll('.sidebar-menu a');
    
    tableSelect.disabled = true;
    tableSelect.style.opacity = '0.6';
    scriptSelect.disabled = true;
    scriptSelect.style.opacity = '0.6';
    openTableBtn.disabled = true;
    openTableBtn.style.opacity = '0.6';
    openTableBtn.style.cursor = 'not-allowed';
    
    // Disable navigation links
    navLinks.forEach(link => {
        link.style.pointerEvents = 'none';
        link.style.opacity = '0.6';
        link.style.cursor = 'not-allowed';
    });
    
    const button = event.target;
    button.disabled = true;
    button.style.opacity = '0.6';
    button.style.cursor = 'not-allowed';
    button.textContent = 'Executing...';
    
    // Add a loading message
    const loadingMsg = document.createElement('div');
    loadingMsg.id = 'execution-loading';
    loadingMsg.style.cssText = 'color: #3498db; font-size: 12px; margin-top: 8px;';
    loadingMsg.textContent = 'Running script, please wait...';
    button.parentElement.appendChild(loadingMsg);
    
    // Set a timeout in case script takes too long (5 minutes = 300000 ms)
    const timeoutId = setTimeout(() => {
        alert('Script execution timed out after 5 minutes. Please check the server logs.');
        // Re-enable controls
        tableSelect.disabled = false;
        tableSelect.style.opacity = '1';
        scriptSelect.disabled = false;
        scriptSelect.style.opacity = '1';
        openTableBtn.disabled = false;
        openTableBtn.style.opacity = '1';
        button.disabled = false;
        button.style.opacity = '1';
        button.textContent = 'Execute Script';
        navLinks.forEach(link => {
            link.style.pointerEvents = 'auto';
            link.style.opacity = '1';
        });
        if (loadingMsg) loadingMsg.remove();
    }, 300000); // 5 minutes
    
    // Store timeout ID to clear if navigation succeeds
    window.scriptExecutionTimeout = timeoutId;
    
    // Navigate to results page
    window.location.href = `/execute-script/${scriptName}`;
}

// Poll active scripts and update indicator
function updateScriptStatus() {
    fetch('/api/active-scripts')
        .then(response => response.json())
        .then(data => {
            const indicator = document.getElementById('script-status-indicator');
            const countSpan = document.getElementById('active-script-count');
            
            if (data.scripts && data.scripts.length > 0) {
                countSpan.textContent = data.scripts.length;
                indicator.style.display = 'block';
                // Continue polling if scripts are still running
                if (!window.scriptStatusInterval) {
                    window.scriptStatusInterval = setInterval(updateScriptStatus, 2000);
                }
            } else {
                indicator.style.display = 'none';
                // Stop polling when no scripts are running
                if (window.scriptStatusInterval) {
                    clearInterval(window.scriptStatusInterval);
                    window.scriptStatusInterval = null;
                }
            }
        })
        .catch(err => console.error('Failed to update script status:', err));
}

// Start polling only when a script is executed (not on page load)
// Initialize polling as null to prevent continuous polling
window.scriptStatusInterval = null;

// Check once for active scripts on page load
// Only start polling if scripts are actually running
updateScriptStatus();

// Show toast notification
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: ${type === 'success' ? '#4caf50' : type === 'error' ? '#f44336' : '#2196f3'};
        color: white;
        padding: 16px 24px;
        border-radius: 4px;
        z-index: 1000;
        animation: slideIn 0.3s ease-in-out;
        max-width: 400px;
        word-wrap: break-word;
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease-in-out';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// Add CSS animations if not already present
if (!document.querySelector('style[data-toast-animations]')) {
    const style = document.createElement('style');
    style.setAttribute('data-toast-animations', '');
    style.textContent = `
        @keyframes slideIn {
            from { transform: translateX(500px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(500px); opacity: 0; }
        }
    `;
    document.head.appendChild(style);
}
</script>
