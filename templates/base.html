<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FastAPI HTMX App{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
    <script>
        // Load saved theme preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
        
        // Toggle theme
        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.classList.toggle('dark-theme');
            root.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeButtonText();
        }
        
        function updateThemeButtonText() {
            const btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                const isDark = document.documentElement.classList.contains('dark-theme');
                btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
            }
        }
        
        // Update button text on page load
        document.addEventListener('DOMContentLoaded', updateThemeButtonText);
    </script>
</head>
<body>
    {% include "sidebar.html" %}
    <div class="main-content">
        <div class="content-header">
            <h2>{% block page_title %}Page{% endblock %}</h2>
            <div class="user-info">
                Logged in as: <strong>{{ username }}@FASTHTMX.LOCAL</strong>
            </div>
        </div>
        <div id="content" style="background: var(--bg-content); padding: 20px; border-radius: 8px; box-shadow: var(--shadow); transition: background 0.3s, color 0.3s; color: var(--text-primary);">
            {% block page_content %}{% endblock %}
        </div>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
