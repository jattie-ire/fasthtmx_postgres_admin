[database]
host = "your-postgres-host"
database = "your_database_name"
user = "your_db_user"
password = "your_db_password"

[app]
# User management table - stores user permissions (view, edit, add, delete, admin, run_scripts, export_data, import_data)
fastapi_users_table = "fastapi_users"
# Kerberos domain for authentication
kerberos_domain = "YOUR.DOMAIN"

[tables]
include = ["table_prefix_.*"]
exclude = [".*_temp.*", ".*_archive.*"]

[dashboard]
display_view = "your_view_name"
display_text = "Dashboard Title"
display_description = "Description of what this dashboard shows"

[age_coloring]
# Enable age-based row coloring (white for today, red for oldest)
enabled = false
# Table(s) to apply age coloring to (leave empty to apply to all tables)
tables = []
# Comma-separated list of column names to use for age calculation
columns = ["last_updated", "created_date", "updated_at"]
# Max age in days to calculate red intensity (older rows will be same red)
max_age_days = 365

[lookups]
table_name = ["column1", "column2"]
another_table = ["lookup_column"]

[scripts]
# Script names map to their paths
"Script Name 1" = "/path/to/script.sh"
"Script Name 2" = "/path/to/another_script.sh"

[scripts.run_in_background]
# Optional: specify which scripts should run in the background
# "Script Name 2" = true

[table_permissions.table_name]
# Optional: custom display name for this table in the Edit Tables dropdown (if not set, table_name is used)
# display_name = "Custom Table Name"
allow_add = true
allow_delete = true
editable_columns = ["column1", "column2"]

[table_permissions.another_table]
allow_add = false
allow_delete = false
editable_columns = ["status_column"]

[kerberos_login]
# Customizable login page text and validation messages
header_text = "Kerberos Login"
username_placeholder = "Employee ID"
password_placeholder = "Password"
# Hover/required field validation messages (shown as tooltips)
username_required_message = "Please enter your employee ID"
password_required_message = "Please enter your domain password"

[audit_trail]
# Database table name for audit trail logs (will be created if not exists)
# Automatically logs all INSERT, UPDATE, DELETE operations with:
#   - userid: The user performing the action
#   - datetime: UTC timestamp of the action
#   - reference: Format "table_name:id=primary_key_value"
#   - action: INSERT | UPDATE | DELETE
table_name = "fastapi_audit_trail"

[deploy_tools]
# Default permissions for auto-generated table configs
default_allow_add = true
default_allow_delete = true
# Automatically identify text columns as editable
auto_detect_text_columns = true
