[database]
host = "your-postgres-host"
database = "your_database_name"
user = "your_db_user"
password = "your_db_password"

[app]
# User management table - stores user permissions (view, edit, add, delete, admin)
fastapi_users_table = "fastapi_users"

[tables]
include = ["table_prefix_.*"]
exclude = [".*_temp.*", ".*_archive.*"]

[dashboard]
display_view = "your_view_name"
display_text = "Dashboard Title"
display_description = "Description of what this dashboard shows"

[lookups]
table_name = ["column1", "column2"]
another_table = ["lookup_column"]

[scripts]
script_name_1 = "/path/to/script.sh"
script_name_2 = "/path/to/another_script.sh"

[table_permissions]
# Define permissions per table (combined with user-level permissions from fastapi_users table)
table_name = { allow_add = true, allow_delete = true, editable_columns = ["column1", "column2"] }
another_table = { allow_add = false, allow_delete = false, editable_columns = ["status_column"] }
